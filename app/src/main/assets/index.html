<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Reading Journal</title>
<style>
:root{--cr:#FFF6E5;--bl:#BFE3F7;--lv:#DCCBF5;--ye:#FFE9A8;--ink:#4A4560;--mu:#8C86A3;--ac:#8E7CC3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cr);color:var(--ink);font:15px ui-rounded,"Segoe UI",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}p{margin:6px 0}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 14px #8e7cc322;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{border-radius:18px;padding:12px;text-align:center}.st b{display:block;font-size:20px}.st span{font-size:12px;color:var(--mu)}
button{border:0;border-radius:16px;padding:11px 16px;font:inherit;font-weight:700;background:var(--lv);color:var(--ink)}
.pri{background:var(--ac);color:#fff}.sm{padding:6px 12px;font-size:13px}
.chip{padding:6px 12px;border-radius:14px;background:#fff;font-size:13px;white-space:nowrap}.chip.on{background:var(--ye);font-weight:700}
input,select,textarea{width:100%;border:2px solid #eadff7;border-radius:14px;padding:10px;font:inherit;background:#fff;color:var(--ink);margin:3px 0 10px}
label{font-size:12px;color:var(--mu);font-weight:700}small{color:var(--mu)}
.row{display:flex;gap:10px;overflow-x:auto;align-items:center}.mini{min-width:130px;text-align:center;margin:0}
.bar{height:12px;background:#f0e8fb;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--ac));border-radius:8px;transition:width 1s}
.fab{position:fixed;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 6px 16px #8e7cc355}
.cv{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bl),var(--lv));font-size:24px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -4px 16px #8e7cc322;z-index:5}
nav div{text-align:center;font-size:11px;color:var(--mu);padding:4px 10px;border-radius:14px}nav div.on{background:var(--ye);color:var(--ink);font-weight:700}nav i{display:block;font-size:20px;font-style:normal}
.sh{display:none;position:fixed;inset:0;background:#4a456055;z-index:20;align-items:flex-end}.sh.on{display:flex}
.shc{background:var(--cr);width:100%;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;animation:up .25s}
.ov{position:fixed;inset:0;background:#4a456040;z-index:30;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fl{position:absolute;top:100%;animation:fly 2.4s ease-out forwards}.ts{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;z-index:40}
.br{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.br i{width:70%;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}.br small{font-size:10px}
.cd{display:block;aspect-ratio:1;border-radius:6px}
.wv{animation:wave 2.2s linear infinite}.w{transition:transform 1.6s cubic-bezier(.25,1.1,.4,1)}.bb{animation:rise 3.5s ease-in infinite}.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes wave{to{transform:translateX(-50px)}}@keyframes rise{from{transform:translateY(0);opacity:.7}to{transform:translateY(-70px);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fly{to{transform:translateY(-110vh) rotate(40deg)}}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="sh" class="sh" onclick="if(event.target==this)closeSheet()"><div id="shc" class="shc"></div></div>
<script>
const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ld(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const L={belum:'Belum dibaca',baca:'Sedang dibaca',selesai:'Selesai dibaca',tunda:'Ditunda'},opts=s=>Object.keys(L).map(k=>`<option value="${k}" ${k==s?'selected':''}>${L[k]}</option>`).join('');
let S={name:'Pembaca',goal:10,books:[],logs:[],ach:{}},db,T='home',cur=null,filt='all',q='',fb='',fc='',ffav=0,sm=0,fr=null,tmpCover=null,_f;
/* ---------- penyimpanan lokal (IndexedDB) ---------- */
const idb=()=>new Promise(r=>{const o=indexedDB.open('rj',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()});
const load=()=>new Promise(r=>{try{const o=db.transaction('kv').objectStore('kv').get('s');o.onsuccess=()=>{if(o.result)S=Object.assign(S,o.result);r()};o.onerror=()=>r()}catch(x){r()}});
const save=()=>{try{db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(x){}};
/* ---------- data ---------- */
const B=id=>S.books.find(b=>b.id==id),pc=b=>b.pages?Math.min(1,b.page/b.pages):0,hasI=l=>l.insight||l.quote||l.refl||l.idea,tm=m=>m>=60?Math.floor(m/60)+'j '+m%60+'m':m+'m';
const pagesOn=d=>S.logs.filter(l=>l.date==d).reduce((a,l)=>a+Math.max(0,l.to-l.from),0),days=()=>[...new Set(S.logs.map(l=>l.date))].sort();
function streak(){const d=new Set(days());let cur=0,t=new Date();if(!d.has(ld(t)))t.setDate(t.getDate()-1);while(d.has(ld(t))){cur++;t.setDate(t.getDate()-1)}
let best=0,run=0,prev=null;for(const s of days()){const c=new Date(s+'T00:00');run=prev&&Math.round((c-prev)/864e5)==1?run+1:1;best=Math.max(best,run);prev=c}return{cur,best}}
const stat=()=>({n:S.books.length,f:S.books.filter(b=>b.status=='selesai').length,r:S.books.filter(b=>b.status=='baca').length,pg:S.books.reduce((a,b)=>a+b.page,0),mn:S.logs.reduce((a,l)=>a+(+l.min||0),0),ins:S.logs.filter(hasI).length});
const AC=[['fp','🌱','First Page','Mulai membaca buku pertama',()=>S.books.some(b=>b.page>0)],['fb','📘','First Book','Selesaikan buku pertama',()=>stat().f>=1],['cr','🔥','Consistent Reader','Membaca 7 hari berturut-turut',()=>streak().best>=7],['be','🧭','Book Explorer','Selesaikan 5 buku',()=>stat().f>=5],['kc','🧠','Knowledge Collector','Kumpulkan 50 insight',()=>stat().ins>=50],['pm','🏆','Page Master','Baca 1.000 halaman',()=>stat().pg>=1000]];
function checkAch(){const n=[];AC.forEach(a=>{if(!S.ach[a[0]]&&a[4]()){S.ach[a[0]]=today();n.push(a)}});if(n.length)save();return n}
/* ---------- visual ---------- */
const MASCOT=`<svg viewBox="0 0 100 100" width="84" class="bob"><rect x="14" y="22" width="72" height="62" rx="16" fill="#DCCBF5"/><rect x="22" y="14" width="56" height="62" rx="14" fill="#FFE9A8"/><circle cx="40" cy="44" r="5" fill="#4A4560"/><circle cx="60" cy="44" r="5" fill="#4A4560"/><circle cx="38.5" cy="42.5" r="1.6" fill="#fff"/><circle cx="58.5" cy="42.5" r="1.6" fill="#fff"/><path d="M42 56q8 8 16 0" stroke="#4A4560" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="31" cy="54" r="5" fill="#F9B8C8" opacity=".7"/><circle cx="69" cy="54" r="5" fill="#F9B8C8" opacity=".7"/></svg>`;
let gid=0;const GP='M15 10H85L75 118Q74 124 68 124H32Q26 124 25 118Z';
const glass=(p,w=90,f=0)=>{const i='g'+gid++;return `<svg viewBox="0 0 100 130" width="${w}" class="gl" data-p="${p}"><defs><clipPath id="${i}"><path d="${GP}"/></clipPath><linearGradient id="${i}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ADBF7"/><stop offset="1" stop-color="#6AAEF0"/></linearGradient></defs><g clip-path="url(#${i})"><g class="w" style="transform:translateY(${114*(1-f)}px)"><g transform="translate(0,10)"><path class="wv" fill="url(#${i}w)" d="M-50 0q12.5-6 25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0V200H-50Z"/></g><circle class="bb" cx="40" cy="110" r="3" fill="#fff" opacity=".6"/><circle class="bb" cx="58" cy="105" r="2.2" fill="#fff" opacity=".6" style="animation-delay:1s"/><circle class="bb" cx="50" cy="112" r="2.6" fill="#fff" opacity=".6" style="animation-delay:2s"/></g></g><path d="${GP}" fill="#ffffff33" stroke="#B9CCE6" stroke-width="3"/><path d="M24 22L30 100" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/></svg>`};
const anim=()=>document.querySelectorAll('.gl').forEach(g=>{const p=+g.dataset.p;setTimeout(()=>{g.querySelector('.w').style.transform=`translateY(${114*(1-p)}px)`},90)});
const cv=(b,w=70)=>b.cover?`<img src="${b.cover}" style="width:${w}px;height:${w*1.45}px;object-fit:cover;border-radius:10px">`:`<div class="cv" style="width:${w}px;height:${w*1.45}px;border-radius:10px">📖</div>`;
function burst(m,em='🎉'){const d=document.createElement('div');d.className='ov';d.onclick=()=>d.remove();d.innerHTML=`<div class="card" style="text-align:center;z-index:2"><div style="font-size:44px">${em}</div><b>${m}</b></div>`+[...Array(22)].map(()=>`<span class="fl" style="left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;font-size:${16+Math.random()*16}px">${['⭐','✨','💧','🫧','📖'][Math.floor(Math.random()*5)]}</span>`).join('');document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function toast(m){const d=document.createElement('div');d.className='ts';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const openSheet=h=>{$('shc').innerHTML=h;$('sh').classList.add('on')},closeSheet=()=>$('sh').classList.remove('on');
const ask=(m,f)=>{_f=f;openSheet(`<h2>${m}</h2><div style="display:flex;gap:10px"><button style="flex:1" onclick="closeSheet()">Batal</button><button class="pri" style="flex:1" onclick="closeSheet();_f()">Ya</button></div>`)};
/* ---------- navigasi ---------- */
const TABS=[['home','🏠','Home'],['lib','📚','Library'],['ins','💡','Insights'],['sta','📊','Statistics'],['pro','🧸','Profile']];
function render(){$('app').innerHTML=cur&&B(cur)?detail():({home,lib,ins,sta,pro}[T])();$('nav').innerHTML=TABS.map(t=>`<div class="${T==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</div>`).join('');anim()}
const go=t=>{T=t;cur=null;render();scrollTo(0,0)},op=id=>{if(B(id)){cur=id;render();scrollTo(0,0)}};
window.back=()=>{if($('sh').classList.contains('on')){closeSheet();return true}if(cur){cur=null;render();return true}if(T!='home'){go('home');return true}return false};
/* ---------- Home ---------- */
const bcard=b=>`<div class="card mini" onclick="op('${b.id}')">${glass(pc(b),60)}<div><b style="font-size:13px">${e(b.title)}</b></div><small>${Math.round(pc(b)*100)}%</small></div>`;
function home(){const s=stat(),k=streak(),tp=pagesOn(today()),g=+S.goal||1,rd=S.books.filter(b=>b.status=='baca'),tips=['Satu halaman kecil hari ini sudah cukup! 🌱','Air di gelasmu menunggu diisi 💧','Catat satu insight hari ini ✨','Buku baik, hari baik 📖'];
return `<h1>Halo, ${e(S.name)}! 👋</h1><div class="card" style="display:flex;gap:10px;align-items:center;background:var(--bl)">${MASCOT}<div><b>Baca. Catat. Tumbuh.</b><div style="margin-top:4px">${tips[new Date().getDate()%4]}</div></div></div>
<div class="grid">${[['📚',s.n,'Total buku','--ye'],['📖',s.r,'Sedang dibaca','--bl'],['📄',s.pg,'Halaman dibaca','--lv'],['💡',s.ins,'Insight','--ye'],['⏱️',tm(s.mn),'Waktu membaca','--bl'],['🔥',k.cur+' hari','Reading streak','--lv']].map(x=>`<div class="st" style="background:var(${x[3]})">${x[0]}<b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>
<h2>Target hari ini</h2><div class="card"><div style="display:flex;justify-content:space-between"><b>${tp} / ${g} halaman</b><span>${Math.min(100,Math.round(tp/g*100))}%</span></div><div class="bar"><i style="width:${Math.min(100,tp/g*100)}%"></i></div></div>
<h2>Sedang dibaca</h2>${rd.length?`<div class="row">${rd.map(bcard).join('')}</div>`:`<div class="card" style="text-align:center">${S.books.length?'Belum ada buku yang sedang dibaca.':'Yuk mulai dengan menambahkan buku pertamamu 📖'}<br><br><button class="pri" onclick="go('lib');${S.books.length?'':'bookForm()'}">Ke Library</button></div>`}
<h2>Aktivitas terbaru</h2>${S.logs.length?[...S.logs].sort((a,b)=>b.ts-a.ts).slice(0,5).map(l=>`<div class="card" style="padding:10px" onclick="op('${l.bid}')"><b>${e((B(l.bid)||{}).title)}</b><br><small>${l.date} • hal ${l.from}→${l.to}${l.min?' • '+l.min+' mnt':''}</small></div>`).join(''):'<div class="card">Belum ada aktivitas.</div>'}`}
/* ---------- Library ---------- */
function lib(){const F={all:'Semua',...L},bs=S.books.filter(b=>filt=='all'||b.status==filt);
return `<h1>My Library 📚</h1><div class="row" style="margin-bottom:10px">${Object.keys(F).map(k=>`<span class="chip ${filt==k?'on':''}" onclick="filt='${k}';render()">${F[k]}</span>`).join('')}</div>${bs.length?`<div class="grid">${bs.map(b=>`<div class="card" onclick="op('${b.id}')" style="margin:0;text-align:center"><div style="display:flex;justify-content:center;gap:8px;align-items:center">${cv(b,60)}${glass(pc(b),46)}</div><b style="display:block;margin-top:6px;font-size:14px">${e(b.title)}</b><small>${e(b.author)}</small><br><small>${L[b.status]} • ${Math.round(pc(b)*100)}%</small></div>`).join('')}</div>`:'<div class="card" style="text-align:center">Belum ada buku di sini 🌱</div>'}<button class="fab pri" onclick="bookForm()">+</button>`}
function readImg(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,360/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
function bookForm(id){const b=id?B(id):{status:'belum',start:today()};tmpCover=b.cover||null;const cs=[...new Set(S.books.map(x=>x.cat).filter(Boolean))];
openSheet(`<h2>${id?'Edit buku':'Tambah buku'}</h2><label>Cover buku (dari galeri)</label><div style="display:flex;gap:10px;align-items:center"><div id="cvp">${cv({cover:tmpCover},50)}</div><input type="file" accept="image/*" onchange="readImg(this.files[0],d=>{tmpCover=d;$('cvp').innerHTML=cv({cover:d},50)})"></div>
<label>Judul buku</label><input id="f_t" value="${e(b.title)}"><label>Penulis</label><input id="f_a" value="${e(b.author)}"><label>Total halaman</label><input id="f_n" type="number" inputmode="numeric" value="${b.pages||''}"><label>Kategori</label><input id="f_c" list="cl" value="${e(b.cat)}"><datalist id="cl">${cs.map(c=>`<option value="${e(c)}">`).join('')}</datalist><label>Tanggal mulai membaca</label><input id="f_d" type="date" value="${b.start||''}"><label>Status</label><select id="f_s">${opts(b.status)}</select><label>Deskripsi singkat (opsional)</label><textarea id="f_x" rows="2">${e(b.desc)}</textarea><button class="pri" style="width:100%" onclick="saveBook('${id||''}')">Simpan</button>`)}
function saveBook(id){const t=$('f_t').value.trim(),n=parseInt($('f_n').value);if(!t||!(n>0))return toast('Isi judul dan total halaman ya');
const b=id?B(id):{id:uid(),page:0};Object.assign(b,{title:t,author:$('f_a').value.trim(),pages:n,cat:$('f_c').value.trim(),start:$('f_d').value,desc:$('f_x').value.trim(),status:$('f_s').value,cover:tmpCover});b.page=Math.min(b.page,n);if(b.status=='selesai')b.page=n;if(!id)S.books.push(b);save();closeSheet();render()}
/* ---------- Detail buku & progres ---------- */
const blk=l=>(l.insight?`<p>💡 ${e(l.insight)}</p>`:'')+(l.quote?`<p><i>❝ ${e(l.quote)}</i></p>`:'')+(l.refl?`<p>🌿 ${e(l.refl)}</p>`:'')+(l.idea?`<p>🎯 ${e(l.idea)}</p>`:'');
const logCard=l=>`<div class="card"><small>${l.date} • hal ${l.from}→${l.to}${l.min?' • '+l.min+' mnt':''}</small>${blk(l)}<button class="sm" onclick="upForm('${l.bid}','${l.id}')">✏️ Edit</button> <button class="sm" onclick="delLog('${l.id}')">🗑️ Hapus</button></div>`;
function detail(){const b=B(cur),p=pc(b),f=fr||0,lg=S.logs.filter(l=>l.bid==b.id).sort((a,c)=>c.ts-a.ts);fr=null;
return `<div style="display:flex;justify-content:space-between"><button class="sm" onclick="back()">← Kembali</button><span><button class="sm" onclick="bookForm('${b.id}')">✏️</button> <button class="sm" onclick="delBook('${b.id}')">🗑️</button></span></div>
<div class="card" style="text-align:center;margin-top:12px"><h1 style="margin:0">${e(b.title)}</h1><div style="color:var(--mu)">${e(b.author)}${b.cat?' • '+e(b.cat):''}</div><div style="display:flex;justify-content:center;gap:14px;align-items:center;margin:12px 0">${cv(b,90)}${glass(p,150,f)}</div>
<b style="font-size:24px">${Math.round(p*100)}%</b><div>Halaman ${b.page} / ${b.pages}</div><select style="margin-top:10px" onchange="setStatus('${b.id}',this.value)">${opts(b.status)}</select><button class="pri" style="width:100%" onclick="upForm('${b.id}')">📖 Update progres</button></div>
${b.desc?`<div class="card">${e(b.desc)}</div>`:''}<h2>Catatan membaca</h2>${lg.length?lg.map(logCard).join(''):'<div class="card">Belum ada catatan.</div>'}`}
const dp=(n,o,v)=>{v=Math.max(0,Math.min(n,parseInt(v)||0));return `Sebelumnya hal ${o} • ${v>=o?'+':''}${v-o} halaman • ${Math.round(v/n*100)}%`};
function upForm(id,lid){const b=B(id),l=lid?S.logs.find(x=>x.id==lid):null;
openSheet(`<h2>${l?'Edit catatan':'Update progres'}</h2><b>${e(b.title)}</b>${l?`<p>Halaman ${l.from} → ${l.to}</p>`:`<p><label>Halaman terakhir dibaca (maks ${b.pages})</label><input id="u_p" type="number" inputmode="numeric" min="0" max="${b.pages}" value="${b.page}" oninput="$('u_d').textContent=dp(${b.pages},${b.page},this.value)"></p><div id="u_d" style="margin:-6px 0 10px;color:var(--ac)">${dp(b.pages,b.page,b.page)}</div>`}
<label>Tanggal</label><input id="u_t" type="date" value="${l?l.date:today()}"><label>Menit membaca (opsional)</label><input id="u_m" type="number" inputmode="numeric" value="${l?l.min||'':''}">
<label>💡 Insight</label><textarea id="u_i" rows="2">${e(l&&l.insight)}</textarea><label>❝ Kutipan menarik</label><textarea id="u_q" rows="2">${e(l&&l.quote)}</textarea><label>🌿 Refleksi pribadi</label><textarea id="u_r" rows="2">${e(l&&l.refl)}</textarea><label>🎯 Ide / tindakan yang ingin diterapkan</label><textarea id="u_a" rows="2">${e(l&&l.idea)}</textarea><button class="pri" style="width:100%" onclick="saveUp('${id}','${lid||''}')">Simpan</button>`)}
function saveUp(id,lid){const b=B(id),g=i=>$(i).value.trim();let l,op0=pc(b);
if(lid)l=S.logs.find(x=>x.id==lid);else l={id:uid(),bid:id,from:b.page,to:Math.max(0,Math.min(b.pages,parseInt($('u_p').value)||0)),ts:Date.now()};
Object.assign(l,{date:$('u_t').value||today(),min:+$('u_m').value||0,insight:g('u_i'),quote:g('u_q'),refl:g('u_r'),idea:g('u_a')});
closeSheet();if(lid){save();render();return}
if(l.to==l.from&&!hasI(l)&&!l.min)return;S.logs.push(l);b.page=l.to;if(b.page>0&&b.status=='belum')b.status='baca';if(b.page>=b.pages)b.status='selesai';else if(b.status=='selesai')b.status='baca';fr=op0;after(b,op0)}
function after(b,o){const n=pc(b),m=[1,.75,.5,.25].find(x=>o<x&&n>=x),a=checkAch();save();render();
setTimeout(()=>{if(m)burst({1:'Gelas penuh! Buku selesai! 🎉',.75:'Hampir penuh! ✨',.5:'Setengah gelas penuh! 💧',.25:'Seperempat jalan! 🌱'}[m],m==1?'🏆':'💧');a.forEach((x,i)=>setTimeout(()=>burst('Pencapaian baru: '+x[2],x[1]),(m?3300:0)+i*3300))},1500)}
function setStatus(id,v){const b=B(id),o=pc(b);b.status=v;if(v=='selesai'&&b.page<b.pages){b.page=b.pages;fr=o}after(b,o)}
const delLog=id=>ask('Hapus catatan ini?',()=>{S.logs=S.logs.filter(l=>l.id!=id);save();render()}),delBook=id=>ask('Hapus buku beserta semua catatannya?',()=>{S.books=S.books.filter(b=>b.id!=id);S.logs=S.logs.filter(l=>l.bid!=id);save();cur=null;render()});
/* ---------- Insights ---------- */
function il(){const k=q.toLowerCase(),r=S.logs.filter(l=>{const b=B(l.bid)||{};return hasI(l)&&(!fb||l.bid==fb)&&(!fc||b.cat==fc)&&(!ffav||l.fav)&&(!k||[l.insight,l.quote,l.refl,l.idea,b.title].join(' ').toLowerCase().includes(k))}).sort((a,b)=>b.ts-a.ts);
return r.length?r.map(l=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${e((B(l.bid)||{}).title)}</b><span onclick="fav('${l.id}')" style="font-size:22px">${l.fav?'⭐':'☆'}</span></div><small>${l.date}</small>${blk(l)}</div>`).join(''):'<div class="card" style="text-align:center">Belum ada insight 🌱<br>Tambahkan saat update progres.</div>'}
function ins(){const cs=[...new Set(S.books.map(b=>b.cat).filter(Boolean))],r=()=>`$('il').innerHTML=il()`;
return `<h1>Insight Collection 💡</h1><input placeholder="🔍 Cari kata kunci…" value="${e(q)}" oninput="q=this.value;${r()}"><div class="grid" style="gap:8px"><select onchange="fb=this.value;${r()}"><option value="">Semua buku</option>${S.books.map(b=>`<option value="${b.id}" ${fb==b.id?'selected':''}>${e(b.title)}</option>`).join('')}</select><select onchange="fc=this.value;${r()}"><option value="">Semua kategori</option>${cs.map(c=>`<option ${fc==c?'selected':''}>${e(c)}</option>`).join('')}</select></div><div class="row" style="margin-bottom:10px"><span class="chip ${ffav?'on':''}" onclick="ffav=!ffav;render()">⭐ Favorit</span><span class="chip" onclick="rnd()">🎲 Random Insight</span></div><div id="il">${il()}</div>`}
const fav=id=>{const l=S.logs.find(x=>x.id==id);l.fav=!l.fav;save();$('il').innerHTML=il()};
function rnd(){const a=S.logs.filter(hasI);if(!a.length)return toast('Belum ada insight');const l=a[Math.floor(Math.random()*a.length)];openSheet(`<h2>🎲 Random Insight</h2><div class="card"><b>${e((B(l.bid)||{}).title)}</b><small> • ${l.date}</small>${blk(l)}</div><div style="display:flex;gap:10px"><button style="flex:1" onclick="closeSheet()">Tutup</button><button class="pri" style="flex:1" onclick="rnd()">Lagi 🎲</button></div>`)}
/* ---------- Statistics ---------- */
function sta(){const s=stat(),d=days().length,avg=d?Math.round(S.logs.reduce((a,l)=>a+Math.max(0,l.to-l.from),0)/d):0,n=sm?30:7,H=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const arr=[...Array(n)].map((_,i)=>{const t=new Date();t.setDate(t.getDate()-(n-1-i));return[pagesOn(ld(t)),t]}),mx=Math.max(1,...arr.map(x=>x[0]));
const cal=[...Array(35)].map((_,i)=>{const t=new Date();t.setDate(t.getDate()-(34-i));const v=pagesOn(ld(t));return `<i class="cd" style="background:${v?'var(--ac)':'#e8e3ef'};opacity:${v?(v>=S.goal?1:.55):.6}"></i>`}).join('');
return `<h1>Statistics 📊</h1><div class="grid">${[['📚',s.n,'Total buku'],['✅',s.f,'Buku selesai'],['📖',s.r,'Sedang dibaca'],['📄',s.pg,'Halaman dibaca'],['⏱️',tm(s.mn),'Waktu membaca'],['💡',s.ins,'Total insight'],['📈',avg,'Rata-rata hal/hari']].map((x,i)=>`<div class="st" style="background:var(${['--ye','--bl','--lv'][i%3]})">${x[0]}<b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>
<h2>Aktivitas membaca</h2><div class="row" style="margin-bottom:8px"><span class="chip ${sm?'':'on'}" onclick="sm=0;render()">Mingguan</span><span class="chip ${sm?'on':''}" onclick="sm=1;render()">Bulanan</span></div>
<div class="card"><div style="display:flex;height:130px;gap:2px;align-items:flex-end">${arr.map((x,i)=>`<div class="br"><i style="height:${x[0]/mx*100}%"></i><small>${n==7?H[x[1].getDay()]:(i%5==0?x[1].getDate():'')}</small></div>`).join('')}</div><small>Halaman per hari (maks ${mx})</small></div>
<h2>Kalender (35 hari terakhir)</h2><div class="card"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cal}</div></div>`}
/* ---------- Profile, backup, ekspor ---------- */
function pro(){return `<h1>Profile 🧸</h1><div class="card"><label>Nama panggilan</label><input value="${e(S.name)}" onchange="S.name=this.value.trim()||'Pembaca';save()"><label>Target halaman per hari</label><input type="number" inputmode="numeric" value="${S.goal}" onchange="S.goal=Math.max(1,parseInt(this.value)||10);save()"></div>
<h2>Pencapaian</h2><div class="grid">${AC.map(a=>{const d=S.ach[a[0]];return `<div class="st" style="background:${d?'var(--ye)':'#eee'};opacity:${d?1:.65}"><div style="font-size:32px;filter:${d?'none':'grayscale(1)'}">${a[1]}</div><b style="font-size:14px">${a[2]}</b><span>${d?'Diperoleh '+d:a[3]}</span></div>`}).join('')}</div>
<h2>Data (offline)</h2><div class="card" style="display:grid;gap:8px"><button onclick="backup()">💾 Backup data</button><button onclick="$('rs').click()">📥 Restore data</button><button onclick="expJ()">📝 Ekspor catatan (JSON)</button><button onclick="expC()">📄 Ekspor catatan (CSV)</button><input id="rs" type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])"></div><p style="text-align:center;color:var(--mu)">Semua data tersimpan di HP ini, tanpa internet.</p>`}
function out(n,m,t){if(window.Android)Android.save(n,m,t);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}}
const backup=()=>out(`reading-journal-backup-${today()}.json`,'application/json',JSON.stringify(S)),expJ=()=>out(`catatan-membaca-${today()}.json`,'application/json',JSON.stringify(S.logs.map(l=>Object.assign({buku:(B(l.bid)||{}).title},l))));
const expC=()=>{const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';out(`catatan-membaca-${today()}.csv`,'text/csv','\ufeff'+['Tanggal','Buku','Penulis','Halaman awal','Halaman akhir','Menit','Insight','Kutipan','Refleksi','Ide/Tindakan'].map(c).join(',')+'\n'+S.logs.map(l=>{const b=B(l.bid)||{};return[l.date,b.title,b.author,l.from,l.to,l.min,l.insight,l.quote,l.refl,l.idea].map(c).join(',')}).join('\n'))};
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!Array.isArray(d.books)||!Array.isArray(d.logs))throw 0}catch(x){return toast('File backup tidak valid')}
ask('Ganti semua data dengan backup ini?',()=>{S=Object.assign({name:'Pembaca',goal:10,ach:{}},d);save();cur=null;render();toast('Data dipulihkan ✅')})};r.readAsText(f)}
(async()=>{await idb();await load();try{navigator.storage.persist()}catch(x){}render()})();
</script></body></html>
